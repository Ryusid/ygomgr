apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ygomgr-ingress
  namespace: ygomgr
spec:
  ingressClassName: nginx
  rules:
    - host: ygomgr.home.lab
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
