apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-registry
  namespace: ygomgr
  labels:
    app: container-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: container-registry
  template:
    metadata:
      labels:
        app: container-registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: sid-mac-mini
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/registry
            - name: registry-tls
              mountPath: /certs
              readOnly: true
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"

            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: "/certs/tls.crt"

            - name: REGISTRY_HTTP_TLS_KEY
              value: "/certs/tls.key"
      volumes:
        - name: registry-storage
          persistentVolumeClaim:
            claimName: registry-pvc
        - name: registry-tls
          secret:
            secretName: container-registry-tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: ygomgr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: container-registry
  namespace: ygomgr
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      name: registry
  selector:
    app: container-registry
